version: 2

models:
  - name: customers
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: email
        data_tests: [not_null]

  - name: accounts
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('customers')
                field: id

  - name: transactions
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('accounts')
                field: id
      - name: type
        data_tests:
          - accepted_values:
              arguments:
                values: [deposit, withdrawal]
